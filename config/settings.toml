[paths]
database = "sentinel.db"
auth_log = "/var/log/auth.log"
dpkg_log = "/var/log/dpkg.log"
log_dir  = "logs"

[time]
naive_timezone = "local"

[collectors]
auth_source = "auth_log"            # "auth_log" | "journald" | "both"
journald_unit = "ssh"
network = true
listening = true
processes = true
filesystem = true
dpkg = true
system = true
max_process_events_per_run = 200

[engine]
collect_interval_seconds = 60
analyze_interval_seconds = 60
retention_interval_hours = 24

[api]
host = "127.0.0.1"
port = 8000
session_idle_minutes = 120
session_absolute_hours = 12
secure_cookies = false              # set true behind an HTTPS reverse proxy
docs_enabled = false
allow_remote = false                # refuse non-loopback binds unless true + trusted_proxy set
trusted_proxy = ""

[notifications]
enabled = false                     # global kill switch, default off

[drift]
allow_custom_paths = false          # allow monitored paths outside the default prefixes
