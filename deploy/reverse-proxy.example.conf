# Example nginx reverse proxy. Terminate TLS here; Sentinel itself binds to loopback only.
server {
    listen 443 ssl http2;
    server_name sentinel.example.internal;

    ssl_certificate     /etc/ssl/certs/sentinel.crt;
    ssl_certificate_key /etc/ssl/private/sentinel.key;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Restrict access to a trusted network or VPN in production.
    # allow 10.0.0.0/8;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_buffering off;          # required: SSE must not be buffered
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
