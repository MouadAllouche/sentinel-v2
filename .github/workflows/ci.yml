name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python3 -m venv venv
          ./venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: ./venv/bin/ruff check .
      - name: Ruff format
        run: ./venv/bin/ruff format --check .
      - name: Mypy
        run: ./venv/bin/mypy
      - name: Pytest with coverage
        run: ./venv/bin/python -m pytest --cov=core --cov=collectors --cov=storage --cov=engine --cov=api --cov-report=term-missing
